[[questions]]
schema_version = "2.1"
id = "q_demo_bank_0005"
type = "solution"
stem = "在 $\\triangle ABC$ 中，内角 $A,B,C$ 所对的边分别为 $a,b,c$，已知 $b\\cos C+c\\cos B=2a\\cos A$。\n\n（1）求角 $A$ 的大小；\n\n（2）若 $a=2$，求 $\\triangle ABC$ 面积的最大值。"
solution = "（1）由射影定理（或正弦定理展开）知 $b\\cos C+c\\cos B=a$，代入条件得 $a=2a\\cos A$，即 $\\cos A=\\dfrac{1}{2}$。又 $0<A<\\pi$，故 $A=\\dfrac{\\pi}{3}$。\n\n（2）由余弦定理 $a^2=b^2+c^2-2bc\\cos A$ 得 $4=b^2+c^2-bc$。由 $b^2+c^2\\ge 2bc$ 得 $4\\ge 2bc-bc=bc$，即 $bc\\le 4$，当且仅当 $b=c=2$ 时取等。\n\n所以 $S=\\dfrac{1}{2}bc\\sin A=\\dfrac{\\sqrt{3}}{4}bc\\le\\sqrt{3}$，即面积最大值为 $\\sqrt{3}$。"
difficulty = "L3"
tags = ["三角函数", "解三角形", "余弦定理", "最值"]

[questions.answer]
kind = "text"
content = "（1）$A=\\dfrac{\\pi}{3}$；（2）面积最大值为 $\\sqrt{3}$。"
final = "A=π/3, S_max=√3"

