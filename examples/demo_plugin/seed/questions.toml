[[questions]]
schema_version = "2.1"
id = "q_demo_bank_0003"
type = "fill_blank"
stem = "曲线 $y=x\\ln x$ 在点 $(1,0)$ 处的切线方程为______。"
solution = "对 $y=x\\ln x$ 求导得 $y'=\\ln x+1$，在 $x=1$ 处斜率 $k=\\ln 1+1=1$，切线过点 $(1,0)$，故切线方程为 $y=x-1$。"
difficulty = "L2"
tags = ["导数", "切线方程"]

[questions.answer]
kind = "expression"
content = "$y=x-1$"
final = "y=x-1"

