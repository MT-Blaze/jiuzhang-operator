
[[questions]]
schema_version = "2.1"
id = "q_demo_bank_0001"
type = "single_choice"
stem = "已知集合 $A=\\{x\\mid x^2-2x-3\\le 0\\}$，$B=\\{x\\mid x>1\\}$，则 $A\\cap B=$（　　）"
solution = "由 $x^2-2x-3\\le 0$ 得 $(x-3)(x+1)\\le 0$，故 $A=[-1,3]$。又 $B=(1,+\\infty)$，所以 $A\\cap B=(1,3]$，选 B。"
difficulty = "L1"
tags = ["集合", "一元二次不等式"]

[questions.answer]
kind = "choice"
choice_keys = ["B"]
final = "B"

