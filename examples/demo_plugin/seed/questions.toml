[[questions]]
schema_version = "2.1"
id = "q_demo_bank_0002"
type = "single_choice"
stem = "设复数 $z=\\dfrac{2+\\mathrm{i}}{1-\\mathrm{i}}$（其中 $\\mathrm{i}$ 为虚数单位），则 $|z|=$（　　）"
solution = "$z=\\dfrac{(2+\\mathrm{i})(1+\\mathrm{i})}{(1-\\mathrm{i})(1+\\mathrm{i})}=\\dfrac{1+3\\mathrm{i}}{2}=\\dfrac{1}{2}+\\dfrac{3}{2}\\mathrm{i}$，故 $|z|=\\sqrt{\\left(\\dfrac{1}{2}\\right)^2+\\left(\\dfrac{3}{2}\\right)^2}=\\dfrac{\\sqrt{10}}{2}$，选 B。"
difficulty = "L1"
tags = ["复数", "模长"]

[questions.answer]
kind = "choice"
choice_keys = ["B"]
final = "B"

