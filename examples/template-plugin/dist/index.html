<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模板插件</title>
  <!-- 样式按域分文件：骨架在 layout.css，控件在 ui.css（PLUGIN_SPEC §2.8.2） -->
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h1>九章算子 · 插件开发模板</h1>
  <div class="bar">
    <button id="load-btn" type="button">取一页公共真题（宿主 API 演示）</button>
    <button id="dock-btn" type="button">向底栏广播（事件总线演示）</button>
    <button id="list-cmd-btn" type="button">查能力字典（command.list）</button>
    <button id="echo-cmd-btn" type="button">调度示例命令（command.execute）</button>
    <span id="status">等待宿主激活……</span>
  </div>
  <div id="list"></div>
  <!-- 脚本按依赖次序加载：公共资产 → core_* → ui_* → 装配层（PLUGIN_SPEC §2.8.1、§2.8.3）。
       /static/common/ui_reactive.js 是底座随发的微型响应式引擎，所有插件共用同一份；
       沙箱 CSP 的 script-src 已授权宿主自身的源，这样引用不会联网。 -->
  <script src="/static/common/ui_reactive.js"></script>
  <script src="core_host.js"></script>
  <script src="ui_render.js"></script>
  <script src="plugin.js"></script>
</body>
</html>
