schema_version = "1.0"
id = "org.jiuzhang.bank-engine"
name = "九章题库"
version = "3.0.0"
api_version = "1.0"
kind = "tool"
description = "九章题库：35 张纯关系表的纯后台数据引擎，注册默认 bank.provider 与三条只读数据命令，供录题、组卷、讲义等业务插件经 Host API 调用；自身不带任何界面。"
author = "九章算子"
license = "Apache-2.0"
min_host_version = "1.0.0"
uninstallable = false
headless = true
show_in_sidebar = false
slots = []
capabilities = ["bank.provider"]
permissions = ["questions:read", "questions:write"]

[bus]
subscribe = []
publish = []

[contributes]

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_stats"
title = "题库统计"
description = "统计当前活跃题库的总题数、题型、难度、年级与考向分布；只读，不返回题目全文。"
returns = "{total, grades:[{id,name,count}], difficulties:[…], types:[…], chapters:[…], textbooks:[…]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_search"
title = "题库检索"
description = "按关键词、年级、难度、题型分页检索题目摘要；只返回前 20 条与题目 id，不返回答案与解析。"
returns = "{total, items:[{id, type, difficulty, stem(≤120字)}]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.query]
type = "string"
description = "题干关键词，留空表示不按关键词过滤"
maxLength = 100

[contributes.commands.params_schema.properties.grade]
type = "string"
enum = ["高一", "高二", "高三"]
description = "年级过滤"

[contributes.commands.params_schema.properties.difficulty]
type = "string"
enum = ["L1", "L2", "L3", "L4"]
description = "难度过滤：L1 基础、L2 中档、L3 难、L4 压轴"

[contributes.commands.params_schema.properties.type]
type = "string"
enum = ["single_choice", "multiple_choice", "fill_blank", "solution"]
description = "题型过滤"

[contributes.commands.params_schema.properties.limit]
type = "integer"
minimum = 1
maximum = 20
description = "返回条数，默认 5"

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_topics"
title = "考向大纲"
description = "按教材版本懒展开考向大纲：不给 parent_id 返回顶层，给了就返回该节点的下一层。"
returns = "{items:[{id, parent_id, name, layer, has_children, question_count, note_count}]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.parent_id]
type = "string"
description = "要展开的大纲节点 id；留空取顶层"
maxLength = 64

[contributes.commands.params_schema.properties.textbook_id]
type = "string"
description = "教材版本 id；留空取当前默认版本"
maxLength = 64

[contributes.commands.params_schema.properties.search]
type = "string"
description = "按节点名搜索"
maxLength = 60
