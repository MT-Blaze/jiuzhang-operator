schema_version = "1.0"
id = "org.jiuzhang.bank-engine"
name = "九章题库"
version = "3.0.0"
api_version = "1.0"
kind = "tool"
description = "九章题库：31 张纯关系表的数据引擎与大纲/题目/待审视图合为一体，同一插件包同时注册 Host API 命令与 webui 前端入口；数据只经底座读写，插件不碰数据库。"
author = "九章算子"
license = "Apache-2.0"
min_host_version = "1.0.0"
uninstallable = false
show_in_sidebar = true
slots = ["question.card", "stage.center"]
capabilities = ["bank.provider", "bank.view", "question.render"]
permissions = ["questions:read", "questions:write"]

[entry]
frontend = "webui/index.html"

[ui]
title = "九章题库筛选"
hint = "下拉选择会实时同步给题库画布（经事件总线），人类手改优先于 AI。"

[[ui.controls]]
type = "select"
key = "grade"
label = "年级"
default = "全部"

[[ui.controls.options]]
value = "全部"
label = "全部"

[[ui.controls.options]]
value = "高一"
label = "高一"

[[ui.controls.options]]
value = "高二"
label = "高二"

[[ui.controls.options]]
value = "高三"
label = "高三"

[[ui.controls]]
type = "select"
key = "difficulty"
label = "难度"
default = "全部"

[[ui.controls.options]]
value = "全部"
label = "全部"

[[ui.controls.options]]
value = "L1"
label = "L1 基础"

[[ui.controls.options]]
value = "L2"
label = "L2 中档"

[[ui.controls.options]]
value = "L3"
label = "L3 难"

[[ui.controls.options]]
value = "L4"
label = "L4 压轴"

[[ui.controls]]
type = "select"
key = "type"
label = "题型"
default = "全部"

[[ui.controls.options]]
value = "全部"
label = "全部"

[[ui.controls.options]]
value = "single_choice"
label = "单选"

[[ui.controls.options]]
value = "multiple_choice"
label = "多选"

[[ui.controls.options]]
value = "fill_blank"
label = "填空"

[[ui.controls.options]]
value = "solution"
label = "解答"

[stage]
region = "center"
mode = "takeover"
title = "九章题库"
priority = 80
singleton = true

[bus]
subscribe = ["ui.params.changed", "system.question_updated", "question.updated", "system.bank_query"]
publish = ["region.dock", "system.open_editor"]

[contributes]

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_stats"
title = "题库统计"
description = "统计当前活跃题库的总题数、题型、难度、年级与考向分布；只读，不返回题目全文。"
returns = "{total, grades:[{id,name,count}], difficulties:[…], types:[…], chapters:[…], textbooks:[…]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_search"
title = "题库检索"
description = "按关键词、年级、难度、题型分页检索题目摘要；只返回前 20 条与题目 id，不返回答案与解析。"
returns = "{total, items:[{id, type, difficulty, stem(≤120字)}]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.query]
type = "string"
description = "题干关键词，留空表示不按关键词过滤"
maxLength = 100

[contributes.commands.params_schema.properties.grade]
type = "string"
enum = ["高一", "高二", "高三"]
description = "年级过滤"

[contributes.commands.params_schema.properties.difficulty]
type = "string"
enum = ["L1", "L2", "L3", "L4"]
description = "难度过滤：L1 基础、L2 中档、L3 难、L4 压轴"

[contributes.commands.params_schema.properties.type]
type = "string"
enum = ["single_choice", "multiple_choice", "fill_blank", "solution"]
description = "题型过滤"

[contributes.commands.params_schema.properties.limit]
type = "integer"
minimum = 1
maximum = 20
description = "返回条数，默认 5"

[[contributes.commands]]
id = "org.jiuzhang.action.data.bank_topics"
title = "考向大纲"
description = "按教材版本懒展开考向大纲：不给 parent_id 返回顶层，给了就返回该节点的下一层。"
returns = "{items:[{id, parent_id, name, layer, has_children, question_count, note_count}]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.parent_id]
type = "string"
description = "要展开的大纲节点 id；留空取顶层"
maxLength = 64

[contributes.commands.params_schema.properties.textbook_id]
type = "string"
description = "教材版本 id；留空取当前默认版本"
maxLength = 64

[contributes.commands.params_schema.properties.search]
type = "string"
description = "按节点名搜索"
maxLength = 60

[[contributes.commands]]
id = "org.jiuzhang.action.view.filter_questions"
title = "筛选题库"
description = "把年级、难度、题型或关键词写进题库视图并立即重查；只改视图筛选态，不改题目数据。"
returns = "{total, filters:{grade,difficulty,type,search}}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.grade]
type = "string"
enum = ["全部", "高一", "高二", "高三"]
description = "年级筛选，全部表示不限"

[contributes.commands.params_schema.properties.difficulty]
type = "string"
enum = ["全部", "L1", "L2", "L3", "L4"]
description = "难度筛选，全部表示不限"

[contributes.commands.params_schema.properties.type]
type = "string"
enum = ["全部", "single_choice", "multiple_choice", "fill_blank", "solution"]
description = "题型筛选，全部表示不限"

[contributes.commands.params_schema.properties.search]
type = "string"
description = "题干关键词"
maxLength = 100

[[contributes.commands]]
id = "org.jiuzhang.action.view.review_queue"
title = "打开待审队列"
description = "切到待审视图，可按灌库标记筛选并翻到第一页；只读，不修改题目。"
returns = "{total, pages, flags:[{name,count}]}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.flag]
type = "string"
description = "待审标记名（如 answer_absent）；留空表示全部"
maxLength = 40
