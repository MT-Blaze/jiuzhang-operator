<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 助手</title>
  <!-- 公式渲染复用底座本地 KaTeX：离线可用，插件不携带、不下载任何远端资源 -->
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="plugin.css" />
</head>
<body>
  <main class="jzochat" id="chatRoot" hidden>
    <header class="jzochat-head">
      <div class="jzochat-ident">
        <span class="jzochat-kicker">AI 助手</span>
        <span class="jzochat-chip" id="chatModeChip">自由对话</span>
      </div>
      <p class="jzochat-model" id="chatModelChip" role="status" aria-live="polite">模型未就绪</p>
    </header>

    <div class="jzochat-thread" id="chatThread" role="log" aria-live="polite" aria-label="对话流" tabindex="0"></div>

    <section class="jzochat-copilot" id="chatCopilot" aria-label="AI 副驾：改写当前题" hidden>
      <div class="jzochat-copilot-head">
        <h3>AI 副驾</h3>
        <span class="jzochat-copilot-ctx" id="copilotCtx">尚未打开题目</span>
      </div>
      <label class="jzochat-field">
        <span>改写字段</span>
        <select id="copilotField">
          <option value="stem">题干</option>
          <option value="solution">解析</option>
        </select>
      </label>
      <label class="sr-only" for="copilotInput">给 AI 副驾的指令</label>
      <textarea id="copilotInput" rows="2" spellcheck="false"
        placeholder="例：把题干改得更简洁，保留 $f(x)$ 记号"></textarea>
      <div class="jzochat-copilot-tools">
        <button type="button" class="jzochat-btn jzochat-btn-primary" id="copilotAsk">让 AI 改写</button>
        <button type="button" class="jzochat-btn" id="copilotApply" disabled>回填到表单</button>
      </div>
      <pre class="jzochat-copilot-out" id="copilotOut" aria-live="polite"></pre>
    </section>

    <div class="jzochat-composer" id="chatForm">
      <label class="sr-only" for="chatPrompt">指令</label>
      <textarea id="chatPrompt" rows="1" placeholder="输入指令…（Enter 换行，Ctrl+Enter 发送）" aria-label="指令"></textarea>
      <button type="button" class="jzochat-btn jzochat-btn-primary" id="chatSend">发送</button>
    </div>
    <p class="jzochat-hint">AI 只能向底座提请求：查数据、开插件都由底座代为执行；它不能点击任何按钮，也不碰你的数据库。</p>
  </main>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="plugin.js"></script>
</body>
</html>
