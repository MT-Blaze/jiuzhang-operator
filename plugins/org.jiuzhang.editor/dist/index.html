<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>录题工作台</title>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="plugin.css">
</head>
<body>
  <!-- 画布实例（stage.center）：三栏全部在画布内——左原图 | 中 LaTeX 源码 | 右渲染。
       源码与渲染共用一条滚动（行高取两栏较高者），左栏原图与两栏逐题对齐。 -->
  <div id="edRoot" class="ed-root" hidden>
    <header class="ed-bar">
      <div class="ed-bar-brand">
        <h1>录题工作台</h1>
        <p class="ed-bar-sub">左原图 · 中 exam-zh 源码 · 右渲染（按内容实际高度，不固定 A4）</p>
      </div>
      <div class="ed-bar-state">
        <span id="edProgress" class="ed-progress" data-active="0" data-total="0">第 — / — 题</span>
        <span id="edFormat" class="ed-format" data-format="latex">格式一</span>
        <span id="edDirty" class="ed-dirty" data-dirty="false">未改动</span>
      </div>
    </header>

    <div class="ed-status" role="status" aria-live="polite">
      <span id="edMetrics" data-render-ms="" data-katex="" data-blocks="" data-errors=""
            data-question-id="" data-row-h="" data-pane-w="">等待载入…</span>
      <span id="edSaved" class="ed-saved" hidden></span>
      <span class="ed-legend">exam-zh 标准环境 · 公式本地 KaTeX · 写入本机 SQLite 题库</span>
    </div>

    <main class="ed-cols" id="edCols">
      <section class="ed-col ed-col-image" id="edPaneImage" aria-label="原图">
        <div class="ed-pane-head">
          <span>原图</span>
          <em id="edImageName">未载入</em>
        </div>
        <div class="ed-pane-body" id="edImageBody" tabindex="0" role="list"
             aria-label="逐题原图与静态框"></div>
      </section>

      <div class="ed-split" id="edSplitImage" role="separator" aria-orientation="vertical"
           tabindex="0" aria-label="拖动调整原图与源码栏宽度"></div>

      <section class="ed-col ed-col-source" id="edPaneSource" aria-label="LaTeX 源码">
        <div class="ed-pane-head">
          <span>LaTeX 源码</span>
          <em id="edSourceHint">只读 · 拖宽可调</em>
        </div>
        <div class="ed-pane-body" id="edSourceBody"></div>
      </section>

      <div class="ed-split" id="edSplitSource" role="separator" aria-orientation="vertical"
           tabindex="0" aria-label="拖动调整源码栏与渲染栏宽度"></div>

      <section class="ed-col ed-col-render" id="edPaneRender" aria-label="渲染结果">
        <div class="ed-pane-head">
          <span>渲染</span>
          <em>按内容实际高度</em>
        </div>
        <div class="ed-pane-body" id="edRenderBody"></div>
      </section>
    </main>

    <div id="edToast" class="ed-toast" role="status" aria-live="polite" data-show="false"></div>
  </div>

  <!-- 辅助栏实例（sidebar.right）：元数据表单 + AI 帮改 + 审核动作，不放源码、不放预览。 -->
  <div id="epRoot" class="ep-root" hidden>
    <p id="epPlaceholder" class="ep-note">辅助栏将在阶段 2 接入。</p>
  </div>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="plugin.js"></script>
</body>
</html>
