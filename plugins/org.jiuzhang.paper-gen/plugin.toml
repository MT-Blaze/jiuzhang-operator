schema_version = "1.0"
id = "org.jiuzhang.paper-gen"
name = "组卷排版"
version = "1.0.1"
api_version = "1.0"
kind = "tool"
description = "把题篮里的真题排成 A4 练习卷：自动分页、公式渲染、答案可选、可直接打印为 PDF。"
author = "九章算子"
license = "Apache-2.0"
min_host_version = "1.0.0"
slots = ["question.card", "stage.center"]
capabilities = ["paper.generate"]
permissions = ["questions:read"]

[entry]
frontend = "dist/index.html"

[ui]
title = "组卷设置"
hint = "切换答案或排版密度，右侧 A4 预览会立刻重排；题篮加减题也会自动跟随。"

[[ui.controls]]
type = "select"
key = "answers"
label = "答案"
default = "隐藏"

[[ui.controls.options]]
value = "隐藏"
label = "隐藏"

[[ui.controls.options]]
value = "显示"
label = "显示"

[[ui.controls]]
type = "select"
key = "density"
label = "排版"
default = "标准"

[[ui.controls.options]]
value = "标准"
label = "标准"

[[ui.controls.options]]
value = "紧凑"
label = "紧凑"

[stage]
region = "center"
mode = "takeover"
title = "组卷排版"
priority = 70
singleton = true

[bus]
subscribe = ["ui.params.changed", "basket.changed", "system.question_updated", "question.updated"]
publish = ["region.dock", "system.open_editor"]

[contributes]

[[contributes.commands]]
id = "org.jiuzhang.action.process.generate_paper"
title = "重排练习卷"
description = "按当前题篮重排 A4 卷面，可临时切换答案显示与排版密度；只改本插件的排版状态。"
returns = "{questions, pages, answers, density, title}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]

[contributes.commands.params_schema.properties.answers]
type = "string"
enum = ["显示", "隐藏"]
description = "是否在卷面带答案"

[contributes.commands.params_schema.properties.density]
type = "string"
enum = ["标准", "紧凑"]
description = "排版密度"

[contributes.commands.params_schema.properties.title]
type = "string"
description = "卷面标题，最多 48 字"
maxLength = 48

[[contributes.commands]]
id = "org.jiuzhang.action.output.export_paper"
title = "打印或导出 PDF"
description = "把当前题篮补齐成完整卷面后调起打印（可另存为 PDF）；会产生打印任务，必须在执行前由老师确认。"
requires_user = true
returns = "{questions, pages, printed}"

[contributes.commands.params_schema]
type = "object"
additionalProperties = false

[contributes.commands.params_schema.properties]
