<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据字典控制台 · 九章算子</title>
  <meta name="theme-color" content="#a63b2b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/app.css?v=20261113" />
  <!-- 数据字典控制台（2026-11-10 四阶段军令）：独立样式，整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console.css?v=20261113" />
  <!-- 知识点与考向折叠树（2026-11-12）：独立样式，整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console_linkage.css?v=20261113" />
  <!-- 二级标签与章节树（2026-11-11）：独立样式，整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console_subtabs.css?v=20261113" />
  <!-- 行政区划树形折叠表（2026-11-11）：整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console_regions.css?v=20261113" />
  <!-- 实体维度双树（2026-11-11）：区划+学校、教材+章节，整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console_entities.css?v=20261113" />
  <!-- 辅助栏极简瘦身（2026-11-11）：折叠设置 + 字典小标签，整块下架删本行即可 -->
  <link rel="stylesheet" href="/static/css/dict_console_sidebar.css?v=20261113" />
</head>
<body>
  <div class="dc-page">
    <header class="dc-topbar">
      <a class="dc-brand" href="/workspace" aria-label="返回工作台">
        <span class="dc-seal" aria-hidden="true">九</span>
        <span class="dc-brand-text">
          <span class="dc-brand-cn">数据字典控制台</span>
          <span class="dc-brand-en">JIUZHANG DICTIONARY</span>
        </span>
      </a>
      <p class="dc-top-state" id="dcOpsState" role="status" aria-live="polite"></p>
      <nav class="dc-topnav" aria-label="页面导航">
        <a class="dc-btn" href="/workspace">返回工作台</a>
        <a class="dc-btn" href="/settings">设置与控制台</a>
        <button class="dc-btn" id="dcImportBtn" type="button">导入数据</button>
        <button class="dc-btn dc-btn-primary" id="dcBackupBtn" type="button">一键备份</button>
      </nav>
    </header>

    <div class="dc-layout">
      <!-- 中央画布：多标签平铺。默认只有【数据看板】；点辅助栏分类新开同名页签 -->
      <main class="dc-canvas" role="main" aria-label="字典画布">
        <div class="dc-tabs-wrap">
          <div class="dc-tabs" id="dcTabs" role="tablist" aria-label="画布标签页"></div>
        </div>
        <div class="dc-panels" id="dcPanels"></div>
      </main>

      <!-- 右侧辅助栏：全局设置 + 三大主分类，只此两个区块。
           辅助栏只渲染一次，画布开页、切页、关页一律不碰这里（常驻总控台）。
           导入 / 备份已挪到顶栏，辅助栏不再承载操作区。 -->
      <aside class="dc-sidebar" role="complementary" aria-label="辅助栏">
        <section class="dc-block dc-block-globals" aria-labelledby="dcGlobalsTitle">
          <h2 class="dc-sr-only" id="dcGlobalsTitle">全局设置</h2>
          <button class="dc-globals-toggle" id="dcGlobalsToggle" type="button"
                  aria-expanded="false" aria-controls="dcGlobalsPanel">
            <span class="dc-globals-icon" aria-hidden="true">⚙️</span>
            <span class="dc-globals-text">
              <span class="dc-globals-title">全局设置</span>
              <span class="dc-globals-label" id="dcGlobalsToggleLabel">加载中…</span>
            </span>
            <span class="dc-globals-caret" aria-hidden="true"></span>
          </button>
          <div class="dc-globals-panel" id="dcGlobalsPanel" hidden>
            <div class="dc-field">
              <label for="dcStage">学段</label>
              <select id="dcStage" disabled>
                <option value="">加载中…</option>
              </select>
            </div>
            <div class="dc-field">
              <label for="dcSubject">学科</label>
              <select id="dcSubject" disabled>
                <option value="">加载中…</option>
              </select>
            </div>
            <div class="dc-field">
              <label for="dcTextbook">教材版本</label>
              <select id="dcTextbook" disabled>
                <option value="">加载中…</option>
              </select>
            </div>
            <button class="dc-btn dc-btn-primary dc-btn-block" id="dcGlobalsConfirm" type="button" disabled>确定</button>
            <p class="dc-globals-state" id="dcGlobalsState" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="dc-block dc-block-nav" aria-labelledby="dcNavTitle">
          <h2 class="dc-sr-only" id="dcNavTitle">字典分类</h2>
          <div class="dc-cat-list" id="dcNavList"></div>
        </section>
      </aside>
    </div>

    <footer class="dc-footer">
      <span>九章算子 · 数据字典控制台</span>
      <span class="dc-footer-sep" aria-hidden="true"></span>
      <span>表表平等 · 星型切换 · 应用层组装</span>
    </footer>
  </div>

  <noscript><p class="dc-noscript">数据字典控制台需要 JavaScript 才能运行。</p></noscript>

  <!-- 请求报错现场：最先加载，之后每笔 fetch 的非 2xx 都有完整记录 -->
  <script src="/static/js/http.js?v=20261113"></script>
  <!-- 控制台自有模块：全部收在 dict_console/ 一个目录，整块下架删目录即可 -->
  <script src="/static/js/dict_console/catalog.js?v=20261113"></script>
  <script src="/static/js/dict_console/ops_log.js?v=20261113"></script>
  <script src="/static/js/dict_console/client.js?v=20261113"></script>
  <script src="/static/js/dict_console/dialog.js?v=20261113"></script>
  <script src="/static/js/dict_console/globals.js?v=20261113"></script>
  <script src="/static/js/dict_console/tabs.js?v=20261113"></script>
  <script src="/static/js/dict_console/row_ops.js?v=20261113"></script>
  <!-- 树节点统一「+」与新增弹窗（2026-11-13）：两棵树共用，必须先于各树模块 -->
  <script src="/static/js/dict_console/tree_add.js?v=20261113"></script>
  <!-- 行政区划树形折叠表（2026-11-11）：整块下架删本行与 table.js 里的 DcRegionsTree 分支 -->
  <script src="/static/js/dict_console/regions_tree.js?v=20261113"></script>
  <script src="/static/js/dict_console/table.js?v=20261113"></script>
  <!-- 知识点与考向折叠树（2026-11-13）：整块下架删这八行与 panels.js 的 DcLinkage.mount 调用 -->
  <script src="/static/js/dict_console/linkage_dnd.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage_tags.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage_guide.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage_add.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage_directions.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage_tree.js?v=20261113"></script>
  <script src="/static/js/dict_console/linkage.js?v=20261113"></script>
  <!-- 二级标签与章节树（2026-11-11）：整块下架删这两行与 dict_console_subtabs.css -->
  <script src="/static/js/dict_console/subtabs.js?v=20261113"></script>
  <script src="/static/js/dict_console/chapter_ops.js?v=20261113"></script>
  <script src="/static/js/dict_console/chapters.js?v=20261113"></script>
  <!-- 实体维度双树（2026-11-11）：底层分表、前端合树；整块下架删这三行 -->
  <script src="/static/js/dict_console/entity_shared.js?v=20261113"></script>
  <script src="/static/js/dict_console/entity_schools.js?v=20261113"></script>
  <!-- 教材与章节树顶两级：学段 → 科目，必须先于 entity_textbooks 加载 -->
  <script src="/static/js/dict_console/textbook_stage_tree.js?v=20261113"></script>
  <script src="/static/js/dict_console/entity_textbooks.js?v=20261113"></script>
  <script src="/static/js/dict_console/panels.js?v=20261113"></script>
  <script src="/static/js/dict_console/import.js?v=20261113"></script>
  <script src="/static/js/dict_console/sidebar.js?v=20261113"></script>
  <script src="/static/js/dict_console/main.js?v=20261113"></script>
  <script src="/static/js/pwa.js?v=20261113"></script>
</body>
</html>
