<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · 九章算子</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/workspace.css" />
</head>
<body class="theme-obsidian">
  <div class="ws-page">
    <!-- Left: tasks + plugin entry -->
    <aside class="ws-sidebar" id="wsSidebar" role="complementary" aria-label="任务与插件入口">
      <header class="ws-sidebar-head">
        <h2>任务</h2>
        <button class="ws-btn ws-btn-sm" id="wsToggleSidebar" aria-expanded="true" aria-controls="wsSidebarContent">折叠</button>
      </header>
      <div class="ws-sidebar-body" id="wsSidebarContent">
        <nav class="ws-task-list" aria-label="任务列表">
          <a class="ws-task-item" href="#">今日拆题</a>
          <a class="ws-task-item" href="#">校对解析</a>
          <a class="ws-task-item" href="#">组卷预览</a>
        </nav>
        <section class="ws-plugin-entry" aria-label="插件入口">
          <h3>插件</h3>
          <ul class="ws-plugin-list">
            <li><a href="/questions">题库管理</a></li>
            <li><a href="#">讲义中心</a></li>
          </ul>
        </section>
      </div>
    </aside>

    <!-- Center: chat + review list -->
    <main class="ws-center" role="main" aria-label="对话与审题清单">
      <section class="ws-chat" aria-label="指令输入">
        <form class="ws-chat-form" id="wsChatForm" aria-label="发送指令">
          <label for="wsPrompt" class="sr-only">指令</label>
          <textarea id="wsPrompt" rows="3" placeholder="输入指令，例如：拆分第 3–5 题"></textarea>
          <div class="ws-chat-actions">
            <button type="submit" class="ws-btn ws-btn-primary" id="wsSendBtn">发送</button>
          </div>
        </form>
      </section>

      <section class="ws-review" aria-label="审题清单">
        <header class="ws-review-head">
          <h2>审题清单</h2>
          <div class="ws-toggle-group" role="group" aria-label="视图切换">
            <button class="ws-toggle-btn active" data-view="original" aria-pressed="true">原卷</button>
            <button class="ws-toggle-btn" data-view="split" aria-pressed="false">拆题</button>
          </div>
        </header>
        <div class="ws-review-body" id="wsReviewBody" tabindex="0" role="listbox" aria-label="题目列表">
          <p class="ws-empty-hint">暂无题目。发送指令后卡片将出现在此处。</p>
        </div>
      </section>
    </main>

    <!-- Right: context (collapsible) -->
    <aside class="ws-context" id="wsContext" role="complementary" aria-label="上下文">
      <header class="ws-context-head">
        <h2>上下文</h2>
        <button class="ws-btn ws-btn-sm" id="wsToggleContext" aria-expanded="true" aria-controls="wsContextBody">折叠</button>
      </header>
      <div class="ws-context-body" id="wsContextBody">
        <section class="ws-section">
          <h3>教材大纲</h3>
          <p class="ws-placeholder">当前未选择教材版本</p>
        </section>
        <section class="ws-section">
          <h3>最近操作</h3>
          <ul class="ws-history">
            <li class="ws-placeholder">无记录</li>
          </ul>
        </section>
      </div>
    </aside>
  </div>

  <script src="/static/js/workspace.js"></script>
</body>
</html>
