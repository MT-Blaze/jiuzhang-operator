<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · 九章算子</title>
  <meta name="theme-color" content="#a63b2b" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/static/css/workspace.css" />
</head>
<body>
  <div class="ws-page">
    <!-- 左栏：底座默认入口 + 动态插件区（不写死任何业务功能） -->
    <aside class="ws-sidebar" id="wsSidebar" role="complementary" aria-label="入口与插件">
      <header class="ws-sidebar-head">
        <div class="ws-sidebar-title">
          <h2>入口</h2>
          <span class="ws-plugin-count" id="wsPluginCount" hidden></span>
        </div>
        <button class="ws-btn ws-btn-sm" id="wsToggleSidebar" aria-expanded="true" aria-controls="wsSidebarBody">折叠</button>
      </header>
      <div class="ws-sidebar-body" id="wsSidebarBody">
        <section class="ws-plugin-entry" aria-label="入口与插件">
          <!-- 自由对话不再是独立入口：它作为列表里的普通一项，与插件同权重、可拖拽排序。 -->
          <ul class="ws-plugin-list" id="wsPluginList" aria-live="polite">
            <li class="ws-plugin-row" data-key="chat" draggable="true">
              <button class="ws-plugin-item" id="wsChatEntry" type="button" aria-current="true">
                <span class="ws-plugin-item-name">自由对话</span>
                <span class="ws-plugin-item-meta">底座内置 · 直接与 AI 对话</span>
              </button>
            </li>
            <li class="ws-plugin-empty">暂无插件</li>
          </ul>
        </section>
      </div>
      <footer class="ws-sidebar-foot">
        <!-- 管理入口死锁在栏底（不随插件列表滚动）：定调令要求左下角也不再放悬浮小图标。 -->
        <button class="ws-console-entry" id="wsConsoleBtn" type="button"
          aria-label="打开设置与控制台" title="设置与控制台">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M4 7h9M17.5 7H20M4 12h4M12.5 12H20M4 17h11M19 17h1" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <circle cx="15.2" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="10.2" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="16.7" cy="17" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
          <span>设置与控制台</span>
        </button>
      </footer>
    </aside>

    <!-- 左栏与中栏之间的拖拽手柄：隐形，命中区比视觉轨道宽 -->
    <div class="ws-resizer ws-resizer-v" id="wsResizerSide" data-resize="side" role="separator"
      aria-orientation="vertical" tabindex="0" aria-label="拖动调整左栏宽度"></div>

    <!-- 中栏：通用画布。Tabs 承载原生对话与 iframe 插件，底座只负责渲染舞台 -->
    <main class="ws-center" role="main" aria-label="画布与当前任务舞台">
      <!-- 画布不再有独立舞台头：页签栏紧贴顶边，当前任务名只留给读屏（aria-live）。 -->
      <h1 class="sr-only" id="wsStageTitle" aria-live="polite">新会话</h1>

      <div class="ws-canvas" id="wsCanvas">
        <div class="ws-tabs-wrap">
          <button class="ws-btn ws-btn-sm ws-drawer-btn" id="wsOpenSidebar" type="button"
            aria-controls="wsSidebarBody" aria-expanded="false">入口</button>
          <div class="ws-tabs" id="wsTabs" role="tablist" aria-label="画布标签页"></div>
        </div>
        <div class="ws-canvas-body" id="wsCanvasBody">
          <section class="ws-tab-panel" id="wsPanelChat" role="tabpanel" aria-label="自由对话" data-tab="chat">
            <div class="ws-thread" id="wsThread" role="log" aria-live="polite" aria-label="对话流" tabindex="0"></div>

            <form class="ws-composer" id="wsChatForm" aria-label="发送指令">
              <label for="wsPrompt" class="sr-only">指令</label>
              <textarea id="wsPrompt" rows="1" placeholder="输入指令…（Enter 发送）"></textarea>
              <button type="submit" class="ws-btn ws-btn-primary ws-send-btn" id="wsSendBtn">发送</button>
            </form>
          </section>
          <section class="ws-tab-panel" id="wsPanelConsole" role="tabpanel" aria-label="设置与控制台" data-tab="console" hidden>
            <!-- 宿主自有页签：同源装载设置面板，不挂 sandbox。
                 挂了 sandbox 又同时给 allow-scripts + allow-same-origin，浏览器会直接警告
                 「这等于没沙箱」——它本来就是宿主同源代码，不该假装有隔离边界。
                 沙箱 iframe 的规矩只适用于插件（AGENTS 铁律二），控制台不是插件。 -->
            <iframe class="ws-console-frame" id="wsConsoleFrame" title="设置与控制台"
              src="about:blank"></iframe>
          </section>
        </div>
      </div>
    </main>

    <!-- 中栏与右栏之间的拖拽手柄 -->
    <div class="ws-resizer ws-resizer-v" id="wsResizerCtx" data-resize="context" role="separator"
      aria-orientation="vertical" tabindex="0" aria-label="拖动调整右栏宽度"></div>

    <!-- 右栏：上下文面板 -->
    <aside class="ws-context" id="wsContext" role="complementary" aria-label="上下文">
      <header class="ws-context-head">
        <h2>上下文</h2>
      </header>
      <div class="ws-context-body" id="wsContextBody">
        <section class="ws-section ws-copilot" id="wsCopilot" aria-label="AI 副驾">
          <div class="ws-copilot-head">
            <h3>AI 副驾</h3>
            <span class="ws-copilot-badge">改题干并回填</span>
          </div>
          <p class="ws-copilot-ctx" id="cpCtx" role="status" aria-live="polite">尚未打开题目</p>
          <label class="ws-field ws-copilot-field" for="cpField">
            <span>改写字段</span>
            <select id="cpField" class="ws-workspace-select">
              <option value="stem">题干</option>
              <option value="solution">解析</option>
            </select>
          </label>
          <label class="sr-only" for="cpInput">给 AI 副驾的指令</label>
          <textarea id="cpInput" rows="2" spellcheck="false"
            placeholder="例：把题干改得更简洁，保留 $f(x)$ 记号"></textarea>
          <div class="ws-copilot-tools">
            <button type="button" id="cpAsk" class="ws-btn ws-btn-sm ws-btn-primary">让 AI 改写</button>
            <button type="button" id="cpBackfill" class="ws-btn ws-btn-sm" disabled>回填到表单</button>
          </div>
          <div class="ws-copilot-out" id="cpOut" role="log" aria-live="polite"></div>
          <p class="ws-copilot-hint">先在中栏「录题工作台」打开或编辑一道题，副驾才能感知上下文；改写只回填到表单，点保存才入库。</p>
        </section>

        <section class="ws-section ws-plugin-panel" id="wsPluginPanel" aria-label="插件快捷操作" hidden>
          <div class="ws-plugin-panel-head">
            <h3 id="wsPluginPanelTitle">插件快捷操作</h3>
            <span class="ws-plugin-panel-badge">AI 可操控</span>
          </div>
          <p class="ws-plugin-panel-desc" id="wsPluginPanelDesc"></p>
          <div class="ws-plugin-controls" id="wsPluginControls"></div>
          <p class="ws-plugin-panel-state" id="wsUiStateSummary" role="status" aria-live="polite"></p>
          <p class="ws-plugin-panel-hint" id="wsPluginPanelHint">点按钮 = 在对话区发送对应指令；你手动改过的参数优先于 AI 自动设定。</p>
        </section>
        <section class="ws-section">
          <h3>当前任务</h3>
          <p class="ws-context-value" id="ctxTask">未选择</p>
        </section>
        <section class="ws-section">
          <h3>教材大纲</h3>
          <p class="ws-placeholder">当前未选择教材版本</p>
        </section>
        <section class="ws-section">
          <h3>模型</h3>
          <p class="ws-context-value" id="ctxModel">未就绪</p>
        </section>
        <section class="ws-section">
          <h3>最近操作</h3>
          <ul class="ws-history" id="ctxHistory">
            <li class="ws-placeholder">暂无记录</li>
          </ul>
        </section>
      </div>
    </aside>

    <!-- 中栏与底栏之间的拖拽手柄 -->
    <div class="ws-resizer ws-resizer-h" id="wsResizerDock" data-resize="dock" role="separator"
      aria-orientation="horizontal" tabindex="0" aria-label="拖动调整输出日志区高度"></div>

    <!-- 输出日志区（Output）：底座托管的事件/日志落点，插件只能经 EventBus 投递，不许直接写 DOM。
         术语铁律（军令 v0.8.2）：这一区叫【输出日志区】，"控制台"三个字专属于画布页签「设置与控制台」。 -->
    <section class="ws-dock" id="wsDock" aria-label="输出日志区">
      <header class="ws-dock-head">
        <h2 class="sr-only" id="wsDockTitle">输出日志区</h2>
        <div class="ws-dock-tabs" id="wsDockTabs" role="tablist" aria-label="输出日志视图">
          <button class="ws-dock-tab" id="wsDockTabLog" type="button" role="tab"
            aria-selected="true" data-view="log">运行日志</button>
          <button class="ws-dock-tab" id="wsDockTabError" type="button" role="tab"
            aria-selected="false" data-view="error">报错诊断</button>
          <button class="ws-dock-tab" id="wsDockTabTerminal" type="button" role="tab"
            aria-selected="false" data-view="terminal">系统终端</button>
        </div>
        <div class="ws-dock-tools">
          <button class="ws-btn ws-btn-sm" id="wsDockClear" type="button">清空</button>
          <button class="ws-btn ws-btn-sm" id="wsToggleDock" type="button" aria-expanded="true" aria-controls="wsDockBody">折叠</button>
        </div>
      </header>
      <div class="ws-dock-body" id="wsDockBody">
        <ul class="ws-dock-log" id="wsDockLog" data-view="log" aria-live="polite">
          <li class="ws-dock-empty">暂无输出。插件与面板事件会出现在这里。</li>
        </ul>
      </div>
    </section>

    <!-- 拖拽安装遮罩 -->
    <div class="ws-drop-overlay" id="wsDropOverlay" hidden aria-hidden="true">
      <div class="ws-drop-card">
        <p class="ws-drop-title">松手即安装插件</p>
        <p class="ws-drop-hint">只收标准 .zip 包；先过 plugin.json 契约校验，再落地 plugins/</p>
      </div>
    </div>
  </div>

  <noscript>
    <p class="ws-noscript">工作台需要 JavaScript 才能进行对话与调用数据总线。</p>
  </noscript>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/js/bus.js"></script>
  <script src="/static/js/splitpane.js"></script>
  <script src="/static/js/stage.js"></script>
  <script src="/static/js/workspace.js"></script>
  <script src="/static/js/pwa.js"></script>
</body>
</html>
