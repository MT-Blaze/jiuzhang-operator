<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · 九章算子</title>
  <meta name="theme-color" content="#a63b2b" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/workspace.css" />
</head>
<body>
  <div class="ws-page">
    <!-- 左栏：任务 / 插件简单入口（不放状态面板） -->
    <aside class="ws-sidebar" id="wsSidebar" role="complementary" aria-label="任务与插件入口">
      <header class="ws-sidebar-head">
        <h2>任务</h2>
        <button class="ws-btn ws-btn-sm" id="wsToggleSidebar" aria-expanded="true" aria-controls="wsSidebarBody">折叠</button>
      </header>
      <div class="ws-sidebar-body" id="wsSidebarBody">
        <nav class="ws-task-list" id="wsTaskList" aria-label="任务入口">
          <button class="ws-task-item" type="button" data-task="拆分试卷" data-seed="我要拆分一份试卷，请告诉我下一步。">拆分试卷</button>
          <button class="ws-task-item" type="button" data-task="校对解析" data-seed="帮我校对一道题的答案与解析。">校对解析</button>
          <button class="ws-task-item" type="button" data-task="组卷导出" data-seed="我想组一份卷子并导出。">组卷导出</button>
          <button class="ws-task-item" type="button" data-task="自由对话" data-seed="">自由对话</button>
        </nav>

        <section class="ws-plugin-entry" aria-label="插件入口">
          <h3>插件</h3>
          <button class="ws-btn ws-btn-block" id="wsPluginInstallBtn" type="button">安装插件 zip 包</button>
          <p class="ws-plugin-drop-hint">或把 .zip 直接拖进本页任意位置</p>
          <ul class="ws-plugin-links">
            <li><a href="/plugins">插件索引</a></li>
            <li><a href="/about">关于底座（About）</a></li>
          </ul>
          <input type="file" id="wsPluginFile" accept=".zip,application/zip" hidden />
        </section>
      </div>
    </aside>

    <!-- 中栏：对话流主区，兼当前任务舞台 -->
    <main class="ws-center" role="main" aria-label="对话流与当前任务舞台">
      <header class="ws-stage-head">
        <div class="ws-stage-title">
          <span class="ws-stage-kicker">当前任务舞台</span>
          <h1 id="wsStageTitle">新会话</h1>
        </div>
        <div class="ws-stage-tools">
          <button class="ws-btn ws-btn-sm ws-drawer-btn" id="wsOpenSidebar" type="button" aria-controls="wsSidebarBody" aria-expanded="false">任务</button>
          <button class="ws-chip" id="wsModelBtn" type="button" title="配置模型 Provider">
            <span class="ws-chip-dot" aria-hidden="true"></span>
            <span id="wsModelLabel">模型 · 未就绪</span>
          </button>
          <button class="ws-btn ws-btn-sm" id="wsToggleContext" type="button" aria-expanded="true" aria-controls="wsContextBody">上下文</button>
        </div>
      </header>

      <div class="ws-thread" id="wsThread" role="log" aria-live="polite" aria-label="对话流" tabindex="0"></div>

      <form class="ws-composer" id="wsChatForm" aria-label="发送指令">
        <label for="wsPrompt" class="sr-only">指令</label>
        <textarea id="wsPrompt" rows="1" placeholder="输入指令…（Enter 发送）"></textarea>
        <button type="submit" class="ws-btn ws-btn-primary ws-send-btn" id="wsSendBtn">发送</button>
      </form>
    </main>

    <!-- 右栏：上下文面板 -->
    <aside class="ws-context" id="wsContext" role="complementary" aria-label="上下文">
      <header class="ws-context-head">
        <h2>上下文</h2>
      </header>
      <div class="ws-context-body" id="wsContextBody">
        <section class="ws-section">
          <h3>当前任务</h3>
          <p class="ws-context-value" id="ctxTask">未选择</p>
        </section>
        <section class="ws-section">
          <h3>教材大纲</h3>
          <p class="ws-placeholder">当前未选择教材版本</p>
        </section>
        <section class="ws-section">
          <h3>模型</h3>
          <p class="ws-context-value" id="ctxModel">未就绪</p>
        </section>
        <section class="ws-section">
          <h3>最近操作</h3>
          <ul class="ws-history" id="ctxHistory">
            <li class="ws-placeholder">暂无记录</li>
          </ul>
        </section>
      </div>
    </aside>

    <!-- Provider 配置面板 -->
    <div class="ws-modal-overlay" id="wsProviderModal" role="dialog" aria-modal="true" aria-labelledby="wsProviderModalTitle" hidden>
      <div class="ws-modal">
        <header class="ws-modal-head">
          <h3 id="wsProviderModalTitle">Provider 配置</h3>
          <button class="ws-btn ws-btn-icon" data-provider-modal-close type="button" aria-label="关闭">&times;</button>
        </header>
        <div class="ws-modal-body">
          <p class="ws-provider-target" id="wsProviderModalTarget"></p>
          <label class="ws-field" for="wsProviderSelect">
            <span>模型 Provider</span>
            <select id="wsProviderSelect" class="ws-workspace-select"></select>
          </label>
          <label class="ws-field" for="wsProviderBaseUrl">
            <span>Base URL</span>
            <input id="wsProviderBaseUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false"
              placeholder="https://api.example.com/v1 或 http://127.0.0.1:11434/v1">
          </label>
          <label class="ws-field" for="wsProviderApiKey">
            <span>API Key</span>
            <input id="wsProviderApiKey" type="password" autocomplete="off" spellcheck="false"
              placeholder="只写入本机 .env，永不回显、永不入库">
          </label>
          <label class="ws-field" for="wsProviderModel">
            <span>模型名</span>
            <input id="wsProviderModel" type="text" autocomplete="off" spellcheck="false"
              placeholder="如 qwen-plus / deepseek-ai/DeepSeek-V3 / llama3">
          </label>
          <p class="ws-provider-hint">本地 Ollama：Base URL 填 <code>http://127.0.0.1:11434/v1</code>，API Key 填任意占位（如 <code>ollama</code>）。保存即热生效，无需重启。</p>
          <p class="ws-provider-test-result" id="wsProviderTestResult" role="status" hidden></p>
        </div>
        <footer class="ws-modal-foot ws-modal-foot-split">
          <button class="ws-btn" id="wsProviderTestBtn" type="button">测试连通性</button>
          <span class="ws-modal-foot-group">
            <button class="ws-btn" data-provider-modal-close type="button">关闭</button>
            <button class="ws-btn ws-btn-primary" id="wsProviderSaveBtn" type="button">保存配置</button>
          </span>
        </footer>
      </div>
    </div>

    <!-- 拖拽安装遮罩 -->
    <div class="ws-drop-overlay" id="wsDropOverlay" hidden aria-hidden="true">
      <div class="ws-drop-card">
        <p class="ws-drop-title">松手即安装插件</p>
        <p class="ws-drop-hint">只收标准 .zip 包；先过 plugin.json 契约校验，再落地 plugins/</p>
      </div>
    </div>
  </div>

  <noscript>
    <p class="ws-noscript">工作台需要 JavaScript 才能进行对话与调用数据总线。</p>
  </noscript>

  <script src="/static/js/workspace.js"></script>
  <script src="/static/js/pwa.js"></script>
</body>
</html>
