<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>工作台集成测试</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>工作台集成测试</h1>
  <button id="testBtn">测试 /api/agent/chat</button>
  <div id="results"></div>

  <script>
    document.getElementById('testBtn').addEventListener('click', function() {
      var results = document.getElementById('results');
      results.innerHTML = '<div class="result">测试中...</div>';

      fetch('/api/agent/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_input: '拆分第3-5题', task_id: 'browser_test' })
      })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(response) {
        var content = response.data && response.data.content;
        var parsed = JSON.parse(content);

        var html = '<div class="result success">';
        html += '<h3>✅ 后端响应成功</h3>';
        html += '<p><strong>Action:</strong> ' + parsed.action + '</p>';
        html += '<p><strong>Mock:</strong> ' + response.mock + '</p>';
        html += '<p><strong>Task ID:</strong> ' + response.task_id + '</p>';
        html += '<pre>' + JSON.stringify(parsed, null, 2) + '</pre>';
        html += '</div>';

        results.innerHTML = html;
      })
      .catch(function(e) {
        results.innerHTML = '<div class="result error">❌ 失败: ' + e.message + '</div>';
      });
    });
  </script>
</body>
</html>
